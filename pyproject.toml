# Packaging metadata lives in setup.py; this file holds tool configuration.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["tests"]   # so tests can `from fakes import FakeManager, FakeClient`
addopts = "-ra"
markers = [
    "unit: fast test with no hardware, GL context, or GUI",
    "gl: requires an OpenGL context (run headless under xvfb / a standalone moderngl context)",
    "integration: drives real stimpack objects (client/protocol/data) over a fake RPC link; no hardware",
    "gui: drives the PyQt6 GUI headlessly (QT_QPA_PLATFORM=offscreen)",
    "e2e: end-to-end against a LIVE server with real screen subprocesses (needs headless GL)",
    "hardware: requires physical rig hardware (DAQ, projector, tracker) — not run in CI",
]

[tool.ruff]
target-version = "py310"
# Sphinx conf.py is an exec'd config with framework idioms (path hacks, theme imports) that trip linters.
extend-exclude = ["docs"]

[tool.ruff.lint]
# Conservative, high-signal ruleset to start: pyflakes (undefined names, unused imports/vars,
# redefinitions, bad f-strings) + syntax errors. Style rules (E/W) can be added once the codebase
# is cleaned up to them.
select = ["F", "E9"]
