name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # Pin 22.04: stable system-package names for headless Mesa software GL + Qt.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      QT_QPA_PLATFORM: offscreen   # the client/gui unit tests import PyQt6 but create no window

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # System libraries for a headless software OpenGL context (Mesa llvmpipe, via EGL/GLX) + Qt.
      - name: Install system libraries (headless OpenGL + Qt)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgl1-mesa-dri libgl1 libglx-mesa0 \
            libegl1 libegl-mesa0 libopengl0 \
            libgl-dev libegl-dev \
            libglib2.0-0 libxkbcommon0 libdbus-1-3

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Lint (ruff)
        run: ruff check .

      # Fast, dependency-light logic tests — no GL/GUI context needed.
      - name: Unit tests
        run: pytest -m unit

      # Full run lifecycle (client/protocol/data over a fake RPC link) and the PyQt6 GUI driven
      # headlessly: real windows and button clicks, offscreen platform, no rig.
      - name: Integration + GUI tests (offscreen)
        run: pytest -m "integration or gui"

      # GL smoke + golden-image tests: standalone moderngl context under a software GL driver,
      # wrapped in xvfb for any GLX fallback. If no GL context is available they skip rather than fail.
      - name: GL tests (headless, software renderer)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a pytest -m gl

      # End-to-end: a live BaseServer with real screen subprocesses rendering on software GL, driven
      # over real sockets through full experiment series. Skips if no GL context is available.
      - name: End-to-end tests (live server + screen subprocesses)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a pytest -m e2e

      # The tiers above give clean failure attribution, but each starts a fresh interpreter, so none
      # of them can catch a tier leaving state behind that breaks the next one. This step does: it is
      # what would have caught the QThread teardown bugs (a __del__ calling wait(), and a run thread
      # outliving the window) that used to segfault a whole-suite run.
      - name: Whole suite in one process (cross-tier interaction)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a pytest

      - name: Upload GL failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gl-failures-py${{ matrix.python-version }}
          path: tests/gl/_failures/
          if-no-files-found: ignore
